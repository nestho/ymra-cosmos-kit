<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>کیت کیهان</title>
  <meta name="description" content="نقشهٔ یادگیری نجوم، فیزیک، ریاضی و الگوریتم برای کلاس دهم — المپیاد ایران و پروژهٔ واقعی با دادهٔ ناسا.">
  <meta name="theme-color" content="#09090b">
  <meta property="og:title" content="کیت کیهان">
  <meta property="og:description" content="نقشهٔ نجوم، المپیاد، الگوریتم و پروژهٔ TESS با دادهٔ ناسا. کلاس دهم، ۱۴۰۵–۱۴۰۶.">
  <meta property="og:type" content="website">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./app.css">
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="app">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" type="button" aria-label="منو">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <strong class="topbar-title">کیت کیهان</strong>
      <button class="icon-btn" id="searchBtnMobile" type="button" aria-label="جستجو">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
    </header>
    <div class="scrim" id="scrim"></div>
    <aside class="nav" id="nav">
      <a class="brand" href="#/home">
        <svg class="brand-mark" width="36" height="36" viewBox="0 0 36 36" fill="none" aria-hidden="true">
          <rect width="36" height="36" rx="10" fill="#141418"/>
          <ellipse cx="18" cy="18" rx="12" ry="4.6" stroke="#c8d0dc" stroke-width="1.15"/>
          <circle cx="18" cy="18" r="3.4" fill="#c8d0dc"/>
        </svg>
        <span class="brand-name">
          <strong>کیت کیهان</strong>
          <span>دهم · ۱۴۰۵–۱۴۰۶</span>
        </span>
      </a>
      <button class="search-launch" id="searchBtn" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        جستجو
        <kbd>⌘K</kbd>
      </button>
      <div class="nav-groups" id="navGroups"></div>
      <a class="nav-progress" href="#/progress">
        <svg class="ring" viewBox="0 0 36 36" aria-hidden="true">
          <circle class="ring-bg" cx="18" cy="18" r="15.5"/>
          <circle class="ring-fg" id="ringFg" cx="18" cy="18" r="15.5"/>
        </svg>
        <span>
          <b><span data-pct>۰٪</span></b>
          <small>پیشرفت روی این دستگاه</small>
        </span>
      </a>
      <div class="nav-foot">
        <a href="https://github.com/nestho/ymra-cosmos-kit" target="_blank" rel="noopener">کد و Issues روی GitHub</a>
      </div>
    </aside>
    <main class="main">
      <article class="page" id="view"></article>
      <nav class="pager" id="pager"></nav>
    </main>
  </div>

  <div class="search" id="search" hidden>
    <div class="search-panel" role="dialog" aria-modal="true" aria-label="جستجو">
      <input id="searchInput" type="search" placeholder="صفحه، منبع، المپیاد، TESS، CERN…" autocomplete="off">
      <div class="search-list" id="searchList"></div>
      <p class="search-hint">Enter باز می‌کند · Esc می‌بندد</p>
    </div>
  </div>

  <script src="./content.js"></script>
  <script src="./app.js"></script>
</body>
</html>
